# Use a NEW server_name with a matching HTTPS certificate.
# This file is documentation; do not overwrite existing TIMECODE vhosts.
server {
    listen 443 ssl;
    server_name BOT_HOSTNAME;
    ssl_certificate /etc/letsencrypt/live/BOT_HOSTNAME/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/BOT_HOSTNAME/privkey.pem;
    client_max_body_size 2m;
    location / {
        proxy_pass http://127.0.0.1:8097;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
}
